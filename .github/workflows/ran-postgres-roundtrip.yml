name: RAN Isolated PostgreSQL Roundtrip

on:
  push:
    branches:
      - feature/rotaganyan-analiz-motoru-sinyal-birlestirme
    paths:
      - 'arac-ran-pg-ci-smoke.mts'
      - 'arac-ran-db-onkontrol.cjs'
      - 'src/lib/methodology/kupon-boundary-risk-audit.ts'
      - 'src/lib/motor-v1/features/gen-pedigri.ts'
      - 'src/lib/motor-v1/engine/feature-vector.ts'
      - 'src/lib/methodology/kupon-boundary-risk-audit.test.ts'
      - 'src/app/api/admin/test-ran-bundle/route.ts'
      - 'arac-ran-pit-kohort-yenile-ve-egit.ps1'
      - 'arac-ran-pit-sadece-egit.ps1'
      - 'arac-ran-pit-dataset-check.cjs'
      - 'arac-ran-kombinasyonlu-sinyal-secimi.mts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/combinatorial-signal-selection.ts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/score-inflation-audit.ts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/score-inflation-audit.test.ts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/pedigree-lineage-audit.ts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/pedigree-lineage-audit.test.ts'
      - 'arac-ran-pedigri-hat-denetimi.mts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/combinatorial-signal-selection.test.ts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/ran-combinatorial-cli-smoke.test.ts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/ran-pit-dataset-check.test.ts'
      - 'arac-ran-egit-ve-degerlendir.mts'
      - 'src/lib/rotaganyan-analiz-motoru/rca/ran-offline-train-smoke.test.ts'
      - 'src/lib/rotaganyan-analiz-motoru/**'
      - 'src/server/services/ran-snapshot-bundle.service*'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20261025160000_add_ran_snapshot_bundle/migration.sql'
      - '.github/workflows/ran-postgres-roundtrip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Real PostgreSQL / canonical snapshot roundtrip (shadow only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ran_shadow
          POSTGRES_PASSWORD: ci_ephemeral_postgres_only
          POSTGRES_DB: ran_shadow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ran_shadow -d ran_shadow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies on ephemeral runner
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-save --package-lock=false --no-audit --no-fund

      - name: Generate isolated Prisma client
        run: npx prisma generate

      # Project-wide typecheck was already PASS on the user's pinned local dependencies.
      # Fresh CI npm resolution upgrades unrelated Stripe SDK types and makes stripe.ts
      # fail with an API-version literal mismatch. Do not let that unrelated dependency
      # drift prevent this isolated PostgreSQL integration test; never report it as CI typecheck PASS.

      - name: Snapshot and isolation tests (no production DB)
        run: |
          npx vitest run \
            src/lib/rotaganyan-analiz-motoru/ran-snapshot-bundle.test.ts \
            src/server/services/ran-snapshot-bundle.service.test.ts \
            src/lib/rotaganyan-analiz-motoru/isolated-db-guard.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/signal-complementarity-audit.test.ts \
            src/lib/rotaganyan-analiz-motoru/feature-calculators/pit-sire-speed.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/ran-db-preflight.test.ts \
            src/lib/methodology/kupon-boundary-risk-audit.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/ran-offline-train-smoke.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/ran-pit-dataset-check.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/combinatorial-signal-selection.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/score-inflation-audit.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/pedigree-lineage-audit.test.ts \
            src/lib/rotaganyan-analiz-motoru/rca/ran-combinatorial-cli-smoke.test.ts

      - name: Real PostgreSQL transaction, readback and cleanup
        env:
          NODE_ENV: test
          RAN_TEST_DATABASE_URL: postgresql://ran_shadow:ci_ephemeral_postgres_only@127.0.0.1:5432/ran_shadow_test
          RAN_TEST_LOCAL_DB_ACK: ran_shadow_test
          DATABASE_URL: postgresql://ran_shadow:ci_ephemeral_postgres_only@127.0.0.1:5432/ran_shadow_test
          RAN_SHADOW_SNAPSHOT_WRITES: isolated-test-only
        run: node node_modules/tsx/dist/cli.mjs ./arac-ran-pg-ci-smoke.mts
