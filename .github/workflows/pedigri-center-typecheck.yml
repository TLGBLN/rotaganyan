name: Pedigri Center Typecheck

on:
  push:
    branches:
      - feature/pedigri-merkezi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Next build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/rotaganyan
          NEXTAUTH_SECRET: pedigree-ci-placeholder
